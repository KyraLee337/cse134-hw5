<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="#" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Kyra Lee's Website</h1>
            <button type="button" id="toggle-theme" hidden>Switch to dark mode</button>
            <nav>
                <ul class="navbar">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>

                </ul>
            </nav>
        </header>
        <form action="https://httpbin.org/post" method="post">
            <label for="name">Enter Your Name [1-100 characters] (required): </label>
            <input type="text" name="name" id="name" autocomplete="name" placeholder="Jane Doe" minlength="1" maxlength="100" required/>
            <label for="email">Enter Your Email (required):</label>
            <input type="email" name="email" id="email" autocomplete="email" placeholder="example@email.com" required/> 
            <label for="comments">Comments [5-1000 characters] (required):</label>
            <textarea name="comments" id="comments" placeholder="Type here..." minlength="5" maxlength="1000" required></textarea>
            <input type="hidden" name="possible_bot" id="possible_bot" value="true"/>
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
